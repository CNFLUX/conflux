[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "conflux"
version = "1.1.3"
description = "A package to calculate neutrino flux from beta decaying sources"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Xianyi Zhang", email = "zhang39@llnl.gov"}
]
keywords = ["neutrino", "physics", "nuclear", "reactor", "beta-decay"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy",
    "scipy>=1.8.1",
    "tqdm",
    "matplotlib",
    "iminuit",
    "fortranformat",
    "pandas",
    "xraydb",
]

[project.urls]
Homepage = "https://github.com/CNFLUX/conflux"
"Bug Tracker" = "https://github.com/CNFLUX/conflux/issues"
Documentation = "https://github.com/CNFLUX/conflux"

[project.scripts]
conflux-setup = "conflux.cli_setup:main"
conflux-update-endf = "update_endf_database:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["conflux*"]

# Bundle all essential data (~80 MB) for dumb-proof installation.
# Users get working databases immediately without manual setup.
#
# Included:
# - Beta decay databases (betaDB/*.xml) - 3.7 MB
# - Fission product yields (fissionDB/*/*.xml) - 14 MB
# - Default neutrino spectra (data/*.csv) - 58 MB
# - Parser scripts and reference data
# - Example models
#
# Excluded (too large):
# - Covariance matrices (*cov*.csv, *corr*.csv) - 3.5 GB
#   Users can download these via conflux-setup if needed

[tool.setuptools.package-data]
conflux = [
    # Parser scripts
    "data/betaDB/*.py",
    "data/fissionDB/*.py",
    "data/fissionDB/ENDF/*.py",
    "data/fissionDB/JEFF/*.py",

    # Beta decay databases
    "data/betaDB/*.xml",
    "data/betaDB/*.csv",

    # Fission product yield databases (XML only, no covariances)
    "data/fissionDB/ENDF/*.xml",
    "data/fissionDB/JEFF/*.xml",

    # Default neutrino spectra
    "data/*.csv",
    "data/*.py",

    # Other databases
    "data/conversionDB/*.csv",
    "data/conversionDB/*.py",
    "data/neutrinoDB/*.csv",
    "data/neutrinoDB/*.py",

    # Example models
    "data/example_models/*.json",
]
