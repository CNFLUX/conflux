[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "conflux"
version = "1.1.3"
description = "A package to calculate neutrino flux from beta decaying sources"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Xianyi Zhang", email = "zhang39@llnl.gov"}
]
keywords = ["neutrino", "physics", "nuclear", "reactor", "beta-decay"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy",
    "scipy>=1.8.1",
    "tqdm",
    "matplotlib",
    "iminuit",
    "fortranformat",
    "pandas",
    "xraydb",
]

[project.urls]
Homepage = "https://github.com/CNFLUX/conflux"
"Bug Tracker" = "https://github.com/CNFLUX/conflux/issues"
Documentation = "https://github.com/CNFLUX/conflux"

[project.scripts]
conflux-setup = "conflux.cli_setup:main"
conflux-update-endf = "update_endf_database:main"

[tool.setuptools]
packages = ["conflux"]
include-package-data = false

# Only parser scripts are bundled in the pip package (~47 KB).
# These are needed by conflux-setup to parse ENSDF files.
#
# All other data files remain in git repository only:
# - For editable installs: conflux-setup copies from your git repo
# - For PyPI installs: conflux-setup downloads from NNDC/online sources

[tool.setuptools.package-data]
conflux = [
    "data/betaDB/*.py",
    "data/betaDB/*.csv",  # Small reference files like Z_to_element.csv
    "data/fissionDB/*.py",  # Unified FPY parser
    "data/fissionDB/ENDF/*.py",  # Legacy ENDF parser (for compatibility)
    "data/fissionDB/JEFF/*.py",  # Legacy JEFF parser (for compatibility)
]
