[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "conflux"
version = "1.1.3"
description = "A package to calculate neutrino flux from beta decaying sources"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Xianyi Zhang", email = "zhang39@llnl.gov"}
]
keywords = ["neutrino", "physics", "nuclear", "reactor", "beta-decay"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy",
    "scipy>=1.8.1",
    "tqdm",
    "matplotlib",
    "iminuit",
    "fortranformat",
    "pandas",
    "xraydb",
]

[project.urls]
Homepage = "https://github.com/CNFLUX/conflux"
"Bug Tracker" = "https://github.com/CNFLUX/conflux/issues"
Documentation = "https://github.com/CNFLUX/conflux"

[project.scripts]
conflux-setup = "conflux.cli_setup:main"
conflux-update-endf = "update_endf_database:main"

[tool.setuptools]
packages = ["conflux"]
include-package-data = true

[tool.setuptools.package-data]
conflux = [
    "data/fissionDB/ENDF/*.xml",
    "data/fissionDB/JEFF/*.xml",
    "data/betaDB/*.xml",
    "data/betaDB/*.csv",
    "data/example_models/*.json",
]
